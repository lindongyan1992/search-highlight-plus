name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

# contents: write  -> create the GitHub release
# id-token: write -> OIDC token used by the attestation action (SLSA provenance)
# attestations: write -> upload build provenance attestations
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - run: npm install
      - run: npm run build
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --latest main.js manifest.json styles.css
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "main.js,styles.css"
